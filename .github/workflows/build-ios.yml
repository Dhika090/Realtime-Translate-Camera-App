name: Build & Test iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode 16
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Found Xcode at: $LATEST_XCODE"
          echo "DEVELOPER_DIR=$LATEST_XCODE/Contents/Developer" >> $GITHUB_ENV

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift Unit Tests
        run: |
          swift test

      - name: Build Release Binary
        run: |
          swift build -c release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeTranslate-Build
          path: .build/
