name: Build & Test iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14 # Mac Apple Silicon runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: |
          # Cari Xcode 16 versi berapa pun yang terpasang di runner
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -r | head -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Menggunakan: $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          else
            echo "Xcode 16 tidak ditemukan secara spesifik, menggunakan default runner:"
          fi
          xcodebuild -version

      - name: Run Swift Unit Tests
        run: |
          swift test

      - name: Build Release Binary
        run: |
          swift build -c release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeTranslate-Build
          path: .build/
