name: Build & Package iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using Xcode at: $LATEST_XCODE"
          echo "DEVELOPER_DIR=$LATEST_XCODE/Contents/Developer" >> $GITHUB_ENV

      - name: Generate Xcode Project with XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build iOS App for iPhone (Release)
        run: |
          xcodebuild build \
            -project RealtimeTranslateApp.xcodeproj \
            -scheme RealtimeTranslateApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned .ipa for Sideloadly
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/RealtimeTranslateApp.app Payload/
          zip -r RealtimeTranslateApp.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeTranslate-IPA
          path: RealtimeTranslateApp.ipa
