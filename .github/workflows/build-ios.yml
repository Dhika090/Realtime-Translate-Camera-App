name: Build & Package iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode Project with XcodeGen
        run: |
          rm -f Package.swift
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build iOS App for iPhone (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RealtimeTranslateApp.xcodeproj \
            -target RealtimeTranslateApp \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log || {
              echo "=== XCODEBUILD ERRORS ==="
              grep -E "error:|fatal error:" build.log | head -n 30 | while IFS= read -r errline; do
                echo "::error::$errline"
              done
              tail -n 30 build.log
              exit 1
            }

      - name: Package Unsigned .ipa for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "RealtimeTranslateApp.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RealtimeTranslateApp.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeTranslate-IPA
          path: RealtimeTranslateApp.ipa
