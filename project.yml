name: RealtimeTranslateApp
options:
  bundleIdPrefix: com.app
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  RealtimeTranslateApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RealtimeTranslateApp
        excludes:
          - Info.plist
    info:
      path: RealtimeTranslateApp/Info.plist
      properties:
        CFBundleDisplayName: Realtime Translate
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Aplikasi ini membutuhkan akses kamera untuk mendeteksi dan menerjemahkan teks asing secara real-time."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app.realtimetranslate
        INFOPLIST_FILE: RealtimeTranslateApp/Info.plist
        GENERATE_InfoPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal

  RealtimeTranslateAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/RealtimeTranslateAppTests
    dependencies:
      - target: RealtimeTranslateApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
